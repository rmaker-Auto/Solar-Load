<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>সোলার ক্যালকুলেশন</title>
<meta name="theme-color" content="#0d2438">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest" id="mf">
<link rel="icon" href="icon-192.png" id="fav">
<link rel="apple-touch-icon" href="icon-192.png" id="ati">
<style>
/* app.css — সাইডবার-ভিত্তিক ডিজাইন (দেওয়া স্ক্রিনশট অনুযায়ী) */
:root{--ac:#0f5ea8;--sb:#0d2438;--bg:#eef3f8;--card:#fff;--ink:#12263a;--mut:#5d7488;--ln:#c9dcee;--inp:#e6f0fa;
  --ok:#1f9d55;--bad:#c0392b;--warn:#e6a100;--sbw:250px;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans Bengali","Hind Siliguri","Kalpurush",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
a{color:var(--ac);cursor:pointer}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------- ফর্ম ---------- */
label{display:block;font-size:13px;font-weight:600;color:var(--ac);margin:0 0 3px}
input,select,textarea{width:100%;padding:6px 10px;border:1.5px solid var(--ac);border-radius:9px;background:var(--inp);outline:none;min-height:36px}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
input[type=checkbox],input[type=radio]{width:auto;min-height:0;accent-color:var(--ac)}
input[type=file]{background:transparent;border:0;padding:6px 0}
input[type=range]{padding:0;border:0;background:transparent;min-height:0;accent-color:var(--ac)}
input[type=color]{padding:2px;height:42px}
select{cursor:pointer}
.pw{position:relative}.pw input{padding-right:40px}
.pw .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;font-size:18px;padding:4px}

/* ---------- বাটন ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border:1.5px solid var(--ac);border-radius:10px;background:#fff;color:var(--ac);font-weight:700;cursor:pointer;min-height:40px;white-space:nowrap}
.btn:hover{background:var(--inp)}
.btn.pri{background:var(--ac);color:#fff}.btn.pri:hover{filter:brightness(1.1)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.btn.ic{padding:0;width:42px;height:42px;font-size:20px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.wide{width:100%}

/* ---------- লেআউট ---------- */
#app{display:flex;height:100vh;height:100dvh;overflow:hidden}
.mn{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--ln);flex:none}
header h1{flex:1;text-align:center;margin:0;font-size:22px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsel{width:auto;min-width:110px;max-width:100%;flex:none;font-weight:700;text-align:center;border-radius:12px}
.av{position:relative;width:48px;height:48px;border-radius:50%;border:2px dashed var(--ln);background:var(--inp);cursor:pointer;flex:none;display:grid;place-items:center;font-size:24px}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.av .pen{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:var(--ac);color:#fff;font-size:11px;display:grid;place-items:center;border:2px solid #fff}
.pill{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--ln);font-size:12px;font-weight:700;max-width:240px;line-height:1.25;cursor:default}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}
.pill.ok{color:var(--ok)}.pill.ok::before{background:var(--ok)}
.pill.busy{color:#9a6b00}.pill.busy::before{background:var(--warn);animation:bl 1s infinite}
.pill.err{color:var(--bad);cursor:pointer}.pill.err::before{background:var(--bad)}
.pill.off{color:#9a6b00}.pill.off::before{background:var(--warn)}
@keyframes bl{50%{opacity:.3}}
main{flex:1;overflow:auto;padding:14px 16px 40px;scroll-behavior:smooth}

/* ---------- সাইডবার ---------- */
#sb{width:var(--sbw);flex:none;background:var(--sb);color:#fff;display:flex;flex-direction:column;position:relative;transition:margin-left .2s}
#app.hid #sb{margin-left:calc(var(--sbw) * -1)}
.noanim #sb{transition:none}
.sbh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 14px 12px;border-bottom:1px solid rgba(255,255,255,.1)}
.sbh b{font-size:16px;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hide{border:0;border-radius:6px;background:rgba(255,255,255,.14);color:#fff;padding:3px 10px;cursor:pointer;font-size:13px}
.hide:hover{background:rgba(255,255,255,.25)}
#nav{flex:1;overflow:auto;padding:6px 0 20px}
#nav button{display:block;width:100%;text-align:left;border:0;background:none;color:#e9f1f9;padding:12px 18px;cursor:pointer;font-size:15px;line-height:1.35;border-left:4px solid transparent}
#nav button:hover{background:rgba(255,255,255,.07)}
#nav button.on{background:var(--ac);border-left-color:#fff;font-weight:700}
.sbr{position:absolute;top:0;right:-4px;width:9px;height:100%;cursor:col-resize;z-index:5;touch-action:none}
.sbr:hover,.sbr.drag{background:linear-gradient(90deg,transparent 3px,var(--ac) 3px,var(--ac) 6px,transparent 6px)}
.bd{display:none}

/* ---------- কার্ড ---------- */
.card{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:16px 18px;margin:0 0 14px}
.card h3{margin:0 0 10px;font-size:18px;color:var(--ac);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h4{margin:14px 0 6px;font-size:14px;color:var(--ac)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1;min-width:120px}.row>.btn{flex:none}.row>.x{flex:none;min-width:0}
.g2{display:grid;grid-template-columns:2fr 1fr;gap:12px;align-items:end}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.note{color:var(--mut);font-size:13px;margin:8px 0 0}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:8px 0 0}
.kpi{background:var(--bg);border-radius:10px;padding:10px 12px;border-left:4px solid var(--ac)}
.kpi b{display:block;font-size:20px;line-height:1.3}.kpi span{color:var(--mut);font-size:13px}
.kpi.warn{border-left-color:var(--warn)}.kpi.bad{border-left-color:var(--bad)}.kpi.ok{border-left-color:var(--ok)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap;vertical-align:middle}
th{color:var(--mut);font-size:13px;font-weight:700}
td input,td select{min-width:70px;padding:5px 7px;min-height:34px;border-width:1.5px}
td.n input{width:92px}
tfoot th{color:var(--ink);font-size:14px}
tr.dim td{opacity:.42}
.bar{height:9px;background:var(--ac);border-radius:5px;min-width:2px}
.res{font-size:19px;font-weight:700;color:var(--ac);padding:8px 0}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:700;background:var(--inp);color:var(--ac)}
.tag.bad{background:#fde4e1;color:var(--bad)}.tag.ok{background:#dff5e8;color:var(--ok)}.tag.warn{background:#fff1cc;color:#8a6200}
.pbar{position:sticky;top:-14px;z-index:4}
.seg{display:inline-flex;border:1.5px solid var(--ac);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--ac);padding:8px 14px;cursor:pointer;font-weight:700}
.seg button.on{background:var(--ac);color:#fff}

/* ---------- থিম, নাম-টাইল ---------- */
.sw{display:flex;gap:12px;flex-wrap:wrap}
.sw button{width:48px;height:48px;border-radius:50%;border:3px solid #dfe7ee;cursor:pointer;padding:0;outline-offset:2px}
.sw button.on{outline:3px solid #111}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:10px}
.tile{border-radius:12px;padding:8px 10px 10px;border-left:5px solid var(--c);background:var(--b)}
.tile small{color:var(--c);font-weight:700;display:block;margin-bottom:4px}
.tile input{background:#fff;border-color:var(--c);font-weight:700}

/* ---------- মডাল / পপআপ (টেনে সরানো যায়) ---------- */
.ov{position:fixed;inset:0;background:rgba(10,25,40,.38);z-index:100}
.dlg{position:fixed;background:#fff;border-radius:16px;box-shadow:0 14px 50px rgba(0,0,0,.35);max-height:94vh;max-width:calc(100vw - 12px);display:flex;flex-direction:column;overflow:hidden}
.dh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;cursor:move;user-select:none;touch-action:none;border-bottom:1px solid var(--ln);background:linear-gradient(#fff,var(--bg))}
.dh b{font-size:17px;color:var(--ac)}
.dh .x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--mut);line-height:1;padding:2px 6px}
.db{padding:14px 16px;overflow:auto;flex:1}
.df{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px 14px}
.df .btn{flex:none}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#17283a;color:#fff;padding:10px 18px;border-radius:12px;z-index:300;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:90vw}
.rec{font:700 26px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px;text-align:center;background:var(--inp);border:2px dashed var(--ac);border-radius:12px;padding:16px 8px;margin:10px 0;user-select:all;word-break:break-all}

/* ---------- লগইন ---------- */
.login{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;overflow:auto;background:linear-gradient(135deg,#0d2438 0%,var(--ac) 100%)}
.lc{width:min(440px,100%);background:#fff;border-radius:18px;padding:26px 28px 24px;box-shadow:0 18px 60px rgba(0,0,0,.35)}
.lc h2{margin:0 0 16px;text-align:center;font-size:24px;color:var(--ac);display:flex;gap:10px;align-items:center;justify-content:center}
.lc label{margin-top:12px;color:var(--mut);font-weight:500}
.lc .btn{margin-top:16px}
.lk{text-align:center;font-size:14px;margin-top:14px;line-height:2}
.lk a{text-decoration:underline;margin:0 4px}
.lc .err{text-align:center}

/* ---------- নোটপ্যাড ---------- */
.ntools{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.ntools>div{flex:1;min-width:150px}.ntools>div.s{flex:3;min-width:220px}
.sliders{display:flex;gap:30px;flex-wrap:wrap;margin:12px 0 4px}.sliders>div{flex:1;min-width:200px}
.nwrap{background:var(--bg);border-radius:12px;padding:12px;min-height:120px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;align-content:flex-start}
.nc{position:relative;width:var(--cw,220px);max-width:100%;border-radius:9px;padding:7px 52px 7px 10px;box-shadow:0 2px 7px rgba(0,0,0,.18);cursor:pointer;overflow:hidden;line-height:1.45}
.nc .ln{white-space:nowrap;overflow:hidden;text-overflow:clip;min-width:0}
.nc .ic{position:absolute;right:6px;top:5px;display:flex;gap:4px}
.nc .ic button{border:0;background:rgba(255,255,255,.55);border-radius:6px;cursor:pointer;font-size:14px;padding:1px 5px;line-height:1.4}
.nc .ic button:hover{background:#fff}
.nc .tt{display:block;background:#ffe03a;padding:0 6px;font-weight:700;border-radius:3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:clip}
.cc{display:inline-block;width:24px;height:24px;border-radius:50%;border:2px solid #aaa;cursor:pointer;vertical-align:middle;margin:0 2px;padding:0}
.cc.on{border-color:#111;box-shadow:0 0 0 2px #fff inset}
.edtools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.edtools .btn{padding:4px 10px;min-height:34px}
.edtools select{width:auto;min-height:34px;padding:4px 8px;border-width:1.5px}
.ed{height:230px;min-height:230px;max-height:230px;overflow-y:auto;overflow-x:hidden;border:1px solid var(--ln);border-radius:10px;padding:10px 12px;background:#fff;color:#111;outline:none;line-height:1.6}
.ed:focus{border-color:var(--ac)}
.ed ul,.ed ol{margin:4px 0;padding-left:26px}.ed input[type=checkbox]{margin-right:6px;transform:scale(1.2)}
.colrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0;font-size:13px;color:var(--mut)}

/* ---------- চার্ট ---------- */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--ink);font-size:12px;font-family:inherit}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ---------- প্রিন্ট/PDF ---------- */
#print{display:none}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block!important;padding:0;color:#000;background:#fff}
  #print h1{font-size:22px;margin:0 0 4px}#print h2{font-size:16px;margin:16px 0 6px;border-bottom:2px solid #333;padding-bottom:2px;break-after:avoid}
  #print table{font-size:12px}#print th,#print td{white-space:normal;padding:3px 6px;border:1px solid #bbb}
  #print .kk{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}#print .kk div{border:1px solid #bbb;padding:4px 8px;font-size:12px}
  #print .chart{break-inside:avoid}
  @page{size:A4;margin:12mm}
}

/* ---------- মোবাইল ---------- */
@media (max-width:820px){
  #sb{position:fixed;left:0;top:0;bottom:0;z-index:60;width:min(var(--sbw),84vw);margin-left:0!important;transform:translateX(-102%);transition:transform .22s}
  #app.mopen #sb{transform:none;box-shadow:6px 0 30px rgba(0,0,0,.4)}
  #app.mopen .bd{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}
  .sbr{display:none}
  header{gap:7px;padding:8px 10px}
  header h1{display:none}
  header{flex-wrap:wrap}
  .hsel{min-width:0;flex:none;max-width:100%}
  .pill{max-width:150px;font-size:11px;padding:5px 8px}
  main{padding:10px 10px 40px}
  .g2{grid-template-columns:1fr}
  .card{padding:13px 12px}
  .lc{padding:22px 18px}
}

/* ---------- কমপ্যাক্ট সারি, বড় লেখার ঘর, ফটো ভিউয়ার ---------- */
.row.inl{flex-wrap:wrap;gap:8px 10px;align-items:flex-end}
.row.inl>*{flex:0 0 auto;min-width:0}
.row.inl input[type=text],.row.inl input:not([type]){width:170px}
.row.inl input[type=date]{width:150px}
.row.inl .pw input{width:120px}
.row.inl .btn{min-height:36px;padding:6px 14px}
.agebox{align-self:center;font-weight:700;color:var(--ac);font-size:14px;padding:0 2px}
input.big{font-weight:700;font-size:17px;color:#0b1d2e;letter-spacing:.2px}
.thumb{position:relative;width:70px;height:70px;border-radius:10px;border:2px solid var(--ac);overflow:hidden;cursor:pointer;background:var(--inp);flex:none;display:grid;place-items:center;font-size:28px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb b{position:absolute;right:2px;bottom:2px;background:rgba(0,0,0,.65);color:#fff;border-radius:8px;padding:0 6px;font-size:12px}
.gal{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:6px}
.gal img{max-width:100%;max-height:calc(100vh - 250px);width:auto;height:auto;display:block;margin:auto;border-radius:8px}
.gal .go{height:60px;font-size:24px}

/* ---------- হাইব্রিড ক্যালকুলেটর টেবিল ---------- */
table.hy{min-width:0;width:100%}
.hy th,.hy td{white-space:normal;vertical-align:middle}
.hy th:first-child,.hy td:first-child{min-width:240px;max-width:300px;position:sticky;left:0;background:#fff;z-index:1;font-weight:600}
.hy td input,.hy td select{min-width:120px;width:100%}
.hy td.o{background:#e8f3ff;font-weight:700;color:#0b3a66;text-align:left}
.hy td.o.r input{background:#e8f3ff;font-weight:700;color:#0b3a66}
.hy td.na{color:var(--mut);text-align:center;background:#f4f4f4}
.hy tr.sec td{background:var(--ac);color:#fff;font-weight:700;position:static}
.hy2 td.o{background:#e8f3ff;font-weight:700;color:#0b3a66}
.hy2 td input{min-width:110px}

/* ---------- প্রোডাক্ট ক্রয় টেবিল ---------- */
.buyc{border-top:4px solid #12a150}
.buyc h3{color:#12a150}
.bk{margin-bottom:12px}.bk .kpi{border-left-color:#12a150}
.btool{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 12px;padding:10px 12px;background:linear-gradient(90deg,#e6f7ee,#f3fbf7);border-radius:12px;border:1px solid #bfe6cf}
.btool .btn{min-height:36px;padding:6px 16px}
table.buy{table-layout:fixed;width:100%;min-width:0;border-collapse:separate;border-spacing:0;border:1px solid var(--ln);border-radius:12px;overflow:hidden}
.buy th{background:#12a150;color:#fff;font-size:13px;white-space:normal;text-align:center;padding:8px 4px;border-bottom:0;line-height:1.3}
.buy th.srt{cursor:pointer;user-select:none}.buy th.srt:hover{background:#0e8a44}
.buy td{padding:3px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid #e3eee8;vertical-align:middle}
.buy tbody tr:nth-child(even){background:#f6fbf8}
.buy tbody tr{cursor:pointer}
.buy tbody tr.sel{outline:2px solid #12a150;outline-offset:-2px;box-shadow:inset 0 0 0 999px rgba(18,161,80,.10)}
.buy td input{width:100%;min-width:0;padding:3px 4px;min-height:30px;font-size:13px;border:1.5px solid transparent;background:transparent;border-radius:6px}
.buy td input:hover{border-color:#bcd9c8}.buy td input:focus{background:#fff;border-color:#12a150;box-shadow:none}
.buy td input[type=date]{font-size:12px;padding:3px 0}
.buy input[type=number]{-moz-appearance:textfield;appearance:textfield}
.buy input[type=number]::-webkit-outer-spin-button,.buy input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.buy td.sn{text-align:center;font-weight:700;color:#0e8a44}
.buy td.c{text-align:right;font-weight:700;padding-right:8px}
.buy tfoot th{background:#e6f7ee;color:#0b5b2e;font-size:14px;text-align:right;padding:8px}
.buy .clip{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;color:var(--ink);padding:3px 4px;border-radius:6px}
.buy .clip:hover{background:rgba(18,161,80,.12)}.buy .ph0{color:#98a8a0}
.buy td.ph{text-align:center}
.thumb.sm{width:34px;height:34px;border-radius:7px;font-size:16px;border-width:1.5px;margin:auto;border-color:#12a150}
.thumb.sm b{font-size:11px;padding:0 4px}
.thumb.sm2{position:relative;width:62px;height:62px;border-radius:10px;border:2px solid var(--ac);overflow:visible;cursor:pointer;display:grid;place-items:center;background:var(--inp);flex:none}
.thumb.sm2 img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.thumb.sm2 .px{position:absolute;right:-7px;top:-7px;width:20px;height:20px;border-radius:50%;background:var(--bad);color:#fff;font-size:11px;display:grid;place-items:center}
@media (max-width:820px){.buyw table.buy{min-width:760px}.buyw{overflow-x:auto}}

.buy td.nt .clip[data-date]{text-align:center}header h1{cursor:text}header h1:hover{background:rgba(18,100,200,.08);border-radius:8px}header h1[contenteditable]{outline:2px solid var(--ac);border-radius:8px;text-overflow:clip;cursor:text;background:var(--inp)}
.buy td .clip{font-size:14px;line-height:1.4}.buy td .clip[data-date]{font-size:14px}
/* শিরোনাম: লেখা অনুযায়ী ঘর বাড়ে/কমে */

<script>
/* ==== lib.js ==== */
/* lib.js — বিশুদ্ধ লজিক (ব্রাউজার ও Node দুই জায়গাতেই চলে): হ্যাশ, মার্জ, ক্যালকুলেশন, তারিখ */
(function (G) {
  'use strict';
  const L = {};
  const now = () => Date.now();
  L.now = now;
  L.num = v => { const x = parseFloat(v); return isFinite(x) ? x : 0; };
  L.uid = () => now().toString(36) + Math.random().toString(36).slice(2, 7);
  L.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  L.f = (v, d = 2) => { v = +v; if (!isFinite(v)) return v > 0 ? '∞' : '—'; return v.toLocaleString('bn-BD', { maximumFractionDigits: d }); };
  L.clone = o => JSON.parse(JSON.stringify(o));
  L.hash53 = (str, seed = 0) => { // cyrb53
    let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;

    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);

    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
  };

  /* ---------- SHA-256 (সব ডিভাইসে একই ফল দেওয়ার জন্য নিজস্ব বাস্তবায়ন) ---------- */
  const PR = []; for (let n = 2; PR.length < 64; n++) { if (PR.every(p => n % p)) PR.push(n); }
  const K = PR.map(p => Math.floor((Math.cbrt(p) % 1) * 4294967296));

  L.sha256 = function (str) {
    const bytes = new TextEncoder().encode(str), len = bytes.length;

    const dv = new DataView(m.buffer);
    dv.setUint32(n - 8, Math.floor(len * 8 / 4294967296)); dv.setUint32(n - 4, (len * 8) >>> 0);

      }
      let a = h[0], b = h[1], c = h[2], d = h[3], e = h[4], f = h[5], g = h[6], hh = h[7];
      for (let i = 0; i < 64; i++) {
        const S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
        const ch = (e & f) ^ (~e & g);
        const t1 = (hh + S1 + ch + K[i] + w[i]) >>> 0;
        const S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
        const mj = (a & b) ^ (a & c) ^ (b & c);
        const t2 = (S0 + mj) >>> 0;
        hh = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
      }
      h[0] = (h[0] + a) >>> 0; h[1] = (h[1] + b) >>> 0; h[2] = (h[2] + c) >>> 0; h[3] = (h[3] + d) >>> 0;
      h[4] = (h[4] + e) >>> 0; h[5] = (h[5] + f) >>> 0; h[6] = (h[6] + g) >>> 0; h[7] = (h[7] + hh) >>> 0;
    }
    return h.map(x => x.toString(16).padStart(8, '0')).join('');
  };
  const rnd = n => { const a = new Uint8Array(n); (G.crypto || {}).getRandomValues ? G.crypto.getRandomValues(a) : a.forEach((_, i) => a[i] = Math.floor(Math.random() * 256)); return a; };
  L.genSalt = () => [...rnd(12)].map(x => x.toString(16).padStart(2, '0')).join('');
  L.hashPin = (pin, salt) => { let h = L.sha256(salt + ':' + String(pin).trim()); for (let i = 0; i < 1500; i++) h = L.sha256(h + salt); return h; };
  L.normRec = c => String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  L.hashRec = (code, salt) => L.hashPin('R:' + L.normRec(code), salt);
  L.genRecovery = () => {
    const al = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', r = rnd(12); let s = '';
    r.forEach((x, i) => { s += al[x % al.length]; if (i % 4 === 3 && i < 11) s += '-'; });
    return s;
  };
  L.makeProfile = (name, pin) => {
    const salt = L.genSalt(), rec = L.genRecovery();
    return { rec, profile: { id: L.uid(), name: String(name).trim(), pic: '', picn: '', salt, ph: L.hashPin(pin, salt), rh: L.hashRec(rec, salt), u: now() } };
  };

  /* ---------- রং মিশ্রণ (থিমের জন্য) ---------- */
  L.mix = (c1, c2, t) => {
    const p = c => { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); };
    const a = p(c1), b = p(c2);
    return '#' + a.map((x, i) => Math.round(x + (b[i] - x) * t).toString(16).padStart(2, '0')).join('');
  };
  // [প্রধান রং, সাইডবার রং, নাম]
  L.THEMES = [
    ['#0f5ea8', '#0d2438', 'নেভি নীল'], ['#2f8fe8', '#16202c', 'আকাশি'], ['#8a6a3b', '#2b2622', 'বাদামি'],
    ['#e69a1a', '#0c1d33', 'সোনালি'], ['#0a8fb8', '#083a4d', 'সায়ান'], ['#8a4fff', '#1f1b3a', 'রংধনু'],
    ['#c2306b', '#4a1a33', 'গোলাপি'], ['#2a8f46', '#0f3a1c', 'সবুজ'], ['#e8650a', '#3d1c0a', 'কমলা'], ['#6c47d8', '#251a52', 'বেগুনি']
  ];

  /* ---------- তারিখ ---------- */
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const BMON = ['জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'];
  L.BMON = BMON;
  L.bn = s => String(s).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
  L.DATEFMTS = [['dMY', 'দিন মাস-নাম বছর'], ['dmy', 'দিন/মাস/বছর'], ['mdy', 'মাস/দিন/বছর'], ['ymd', 'বছর-মাস-দিন'], ['dmyd', 'দিন-মাস-বছর'], ['bn', 'বাংলা (২০ অক্টোবর ২০২৬)']];
  L.parseD = v => {
    if (v instanceof Date) return v;
    if (typeof v === 'number') return new Date(v);
    const m = /^(\d{4})-(\d\d)-(\d\d)/.exec(v || '');
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  };
  L.fmtDate = (v, fmt) => {
    const d = L.parseD(v); if (!d || isNaN(d)) return '';
    const D = d.getDate(), M = d.getMonth(), Y = d.getFullYear(), p = n => String(n).padStart(2, '0');
    switch (fmt) {
      case 'dmy': return `${p(D)}/${p(M + 1)}/${Y}`;
      case 'mdy': return `${p(M + 1)}/${p(D)}/${Y}`;
      case 'ymd': return `${Y}-${p(M + 1)}-${p(D)}`;
      case 'dmyd': return `${p(D)}-${p(M + 1)}-${Y}`;
      case 'bn': return L.bn(D) + ' ' + BMON[M] + ' ' + L.bn(Y);
      default: return `${D} ${MON[M]} ${Y}`;
    }
  };
  L.ymd = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  L.fmtHM = h => {
    if (!isFinite(h)) return 'সীমাহীন';
    const m = Math.round(h * 60), hh = Math.floor(m / 60), mm = m % 60;
    return (hh ? L.bn(hh) + ' ঘণ্টা ' : '') + (mm || !hh ? L.bn(mm) + ' মিনিট' : '');
  };

  /* ---------- ডাটা মডেল ---------- */
  L.SUN0 = [4.5, 5.2, 5.7, 5.9, 5.4, 4.4, 4.2, 4.4, 4.3, 4.5, 4.4, 4.2];
  L.DIM = [31, 28.25, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  L.defCfg = () => ({
    V: 24, sun: 5, loss: 25, eff: 90, dod: 50, days: 1, safe: 25, pf: 0.8, pw: 550, bw: 12, bah: 100, price: 8, cur: '৳', dayfrac: 50,
    pvIsc: 14, pvVoc: 50, pvVmp: 42, ps: 2, ccVmax: 150, lenPV: 10, lenArr: 5, lenCC: 2, lenBat: 2, lenAC: 10,
    dropPV: 3, dropArr: 2, dropBat: 1.5, dropAC: 3, acV: 220, rho: 0.0217, derate: 0.9
  });
  L.defCost = () => ({ pw: 35, bat: 15000, inv: 12, ctrl: 250, oth: 10000, lab: 8, maint: 2000, deg: 0.6, esc: 0, bRep: 0 });
  L.defBk = () => ({ n: 0, type: 'acid', bv: 0, bah: 0, soc: 100, min: '', fac: 100, solar: 0, out: 2, times: 2, off: {} });
  // ব্যাটারির ধরন: ব্যবহারযোগ্য গভীরতা (DoD %), কার্যদক্ষতা (%), Peukert ধ্রুবক
  L.BTYPES = {
    acid: { name: 'সাধারণ লেড-অ্যাসিড ব্যাটারি', dod: 50, eff: 82, k: 1.3, cmax: 0.15 },
    tub: { name: 'টিউবুলার ব্যাটারি', dod: 60, eff: 85, k: 1.2, cmax: 0.15 },
    tall: { name: 'টল টিউবুলার ব্যাটারি', dod: 70, eff: 88, k: 1.15, cmax: 0.2 },
    lfp: { name: 'লিথিয়াম ফসফেট (LiFePO₄)', dod: 90, eff: 97, k: 1.05, cmax: 0.5 },
    li: { name: 'লিথিয়াম আয়ন (Li-ion / NMC)', dod: 80, eff: 95, k: 1.08, cmax: 0.5 }
  };
  L.defApp = () => ({ name: 'সোলার ক্যালকুলেশন', short: 'সোলার', emoji: '☀️', color: '#f2a900', img: '' });
  L.newProject = name => ({ id: L.uid(), name: name || 'প্রজেক্ট ১', u: now(), cfg: L.defCfg(), loads: [], sunM: L.SUN0.slice(), cost: L.defCost(), bk: L.defBk() });
  L.fixProject = p => {
    p.id = p.id || L.uid(); p.name = p.name || 'প্রজেক্ট'; p.u = p.u || 0;
    p.cfg = Object.assign(L.defCfg(), p.cfg || {});
    p.cost = Object.assign(L.defCost(), p.cost || {});
    p.bk = Object.assign(L.defBk(), p.bk || {}); p.bk.off = p.bk.off || {};
    if (!Array.isArray(p.sunM) || p.sunM.length !== 12) p.sunM = L.SUN0.slice();
    p.loads = (p.loads || []).filter(Boolean).map(l => { l.id = l.id || L.uid(); l.t = l.t || 'b'; l.u = l.u || 0; return l; });
    return p;
  };
  L.newData = profile => ({
    v: 2, profile, prefs: { u: 0, theme: 0, labels: {}, dateFmt: 'dMY', app: L.defApp() },
    projects: [L.newProject()], notes: [], buys: [], tomb: {}
  });
  L.fixPics = n => {
    n.id = n.id || L.uid(); n.u = n.u || 0;
    if (!Array.isArray(n.pics)) n.pics = [];
    if (n.imn || n.img) { if (!n.pics.length) n.pics.push({ imn: n.imn || '', img: n.img || '' }); delete n.imn; delete n.img; }
    n.pics = n.pics.filter(p => p && (p.imn || p.img));
    return n;
  };
  L.fixData = d => {
    d.v = 2; d.tomb = d.tomb || {};
    d.prefs = Object.assign({ u: 0, theme: 0, labels: {}, dateFmt: 'dMY' }, d.prefs || {});
    d.prefs.labels = d.prefs.labels || {}; d.prefs.app = Object.assign(L.defApp(), d.prefs.app || {});
    d.projects = (d.projects || []).filter(Boolean).map(L.fixProject);
    if (!d.projects.length) d.projects.push(L.newProject());
    d.notes = (d.notes || []).filter(Boolean).map(L.fixPics);
    d.buys = (d.buys || []).filter(Boolean).map(L.fixPics);
    return d;
  };
  L.fromLegacy = (old, profile) => {
    const d = L.newData(profile), p = d.projects[0];
    p.cfg = Object.assign(L.defCfg(), old.cfg || {});
    p.loads = (old.loads || []).map(l => ({ id: L.uid(), n: l.n || '', w: l.w, q: l.q, h: l.h, s: l.s, t: 'b', u: now() }));
    return d;
  };
  L.isNewFmt = o => o && o.v === 2 && Array.isArray(o.projects);
  L.isLegacy = o => o && !L.isNewFmt(o) && (Array.isArray(o.loads) || o.cfg);

  /* ---------- মার্জ (দুই ডিভাইসের ডাটা একত্র) ---------- */
  L.mergeList = (a, b, tomb, fix) => {
    const m = new Map();
    for (const r of (a || []).concat(b || [])) {
      if (!r || !r.id) continue;
      const o = m.get(r.id);
      if (!o) m.set(r.id, r);
      else { const w = (r.u || 0) > (o.u || 0) ? r : o, l = w === r ? o : r; if (fix) fix(w, l); m.set(r.id, w); }
    }
    tomb = tomb || {};
    return [...m.values()].filter(r => !(tomb[r.id] >= (r.u || 0)));
  };
  const imgFix = (w, l) => { (w.pics || []).forEach(p => { if (!p.img && p.imn) { const q = (l.pics || []).find(x => x.imn === p.imn && x.img); if (q) p.img = q.img; } }); };
  L.mergeData = (a, b) => {
    const tomb = {};
    for (const t of [a.tomb, b.tomb]) for (const k in (t || {})) tomb[k] = Math.max(tomb[k] || 0, t[k]);
    const lim = now() - 90 * 864e5; for (const k in tomb) if (tomb[k] < lim) delete tomb[k];
    const newer = (x, y) => ((y.u || 0) > (x.u || 0) ? y : x);
    const pw = newer(a.profile, b.profile), pl = pw === a.profile ? b.profile : a.profile;
    const profile = Object.assign({}, pw);
    if (!profile.pic && pl.pic && pl.picn === profile.picn) profile.pic = pl.pic;
    const prefs = Object.assign({}, newer(a.prefs, b.prefs));
    const by = new Map();
    for (const src of [a.projects, b.projects]) for (const p of (src || [])) {
      const o = by.get(p.id);
      if (!o) by.set(p.id, { best: p, ls: [p.loads] });
      else { o.ls.push(p.loads); if ((p.u || 0) > (o.best.u || 0)) o.best = p; }
    }
    let projects = [...by.values()].filter(o => !(tomb[o.best.id] >= (o.best.u || 0))).map(o => {
      const p = Object.assign({}, o.best); p.loads = L.mergeList(o.ls[0], o.ls[1], tomb); return p;
    });
    const notes = L.mergeList(a.notes, b.notes, tomb, imgFix), buys = L.mergeList(a.buys, b.buys, tomb, imgFix);
    const out = { v: 2, profile, prefs, projects, notes, buys, tomb };
    return L.fixData(out);
  };

  /* ---------- ক্যালকুলেশন (মূল ড্যাশবোর্ডের সূত্র অপরিবর্তিত) ---------- */
  L.viewK = (t, view, frPct) => {
    t = t || 'b'; const fr = L.num(frPct) / 100;
    if (view === 'day') return t === 'd' ? 1 : t === 'b' ? fr : 0;
    if (view === 'night') return t === 'n' ? 1 : t === 'b' ? 1 - fr : 0;
    return 1;
  };
  L.calc = (P, view) => {
    const c = P.cfg, n = L.num; view = view || 'all';
    const Ls = P.loads.map(l => {
      const k = L.viewK(l.t, view, c.dayfrac), inc = k > 0;
      const W0 = n(l.w) * n(l.q), Wh0 = W0 * n(l.h);
      const w = inc ? W0 : 0, wh = inc ? w * n(l.h) * (view === 'all' ? 1 : k) : 0;

    };

    /* ---------- ৭. সিঙ্ক নিয়ন্ত্রণ ও অফলাইন ---------- */
    const c7 = card(`<h3>🔄 সিঙ্ক নিয়ন্ত্রণ ও অফলাইন</h3>
      <label style="display:flex;gap:8px;align-items:center;font-weight:600;color:var(--ink)"><input type="checkbox" id="sa" ${dev.auto ? 'checked' : ''}> অটো সিঙ্ক চালু (নেট থাকলে পরিবর্তনের ৩ সেকেন্ড পর নিজে সিঙ্ক হবে)</label>
      <div class="row" style="margin-top:10px"><div style="max-width:360px"><label>কোন নেটওয়ার্কে অটো সিঙ্ক হবে</label><select id="sn2"><option value="any" ${dev.net !== 'wifi' ? 'selected' : ''}>যেকোনো নেটওয়ার্ক</option><option value="wifi" ${dev.net === 'wifi' ? 'selected' : ''}>শুধু ওয়াইফাই</option></select></div></div>
      <div id="sstat" class="card" style="background:var(--inp);margin:12px 0;line-height:1.9"></div>
      <div class="row"><button class="btn" id="sinst">📲 অ্যাপ হিসাবে ইনস্টল করুন</button><button class="btn" id="sper">🔒 স্থায়ী স্টোরেজের অনুরোধ</button><button class="btn" id="sref">অবস্থা দেখুন</button></div>`);
    root.appendChild(c7);
    $('#sa', c7).onchange = e => { dev.auto = e.target.checked; A.saveDev(); A.setStatus(); if (dev.auto) A.sync({}); };
    $('#sn2', c7).onchange = e => { dev.net = e.target.value; A.saveDev(); };
    async function stat() {
      const c = navigator.connection || {}, mm = A.M(); let per = 'অজানা';
      try { if (navigator.storage && navigator.storage.persisted) per = (await navigator.storage.persisted()) ? 'হ্যাঁ ✓' : 'না (অনুরোধ করুন)'; } catch (e) { }
      const sw = 'serviceWorker' in navigator && navigator.serviceWorker.controller ? 'প্রস্তুত ✓ (নেট ছাড়াও খুলবে)' : ('serviceWorker' in navigator ? 'এখনও প্রস্তুত নয় — একবার পেজ রিলোড করুন (HTTPS দরকার)' : 'এই ব্রাউজারে নেই');
      $('#sstat', c7).innerHTML = `🌐 ইন্টারনেট: <b>${navigator.onLine ? 'আছে' : 'নেই'}</b>${c.effectiveType ? ' · ' + esc(c.effectiveType) : ''}${c.type ? ' · ' + esc(c.type) : ''}<br>☁ Google সংযোগ: <b>${dev.url ? 'সেট করা আছে' : 'নেই'}</b>${mm.last ? ' · শেষ সিঙ্ক ' + esc(A.fmtDT(mm.last)) : ''}<br>⏳ অসিঙ্কড পরিবর্তন: <b>${mm.dirty ? 'আছে' : 'নেই'}</b><br>📴 অফলাইন মোড: <b>${sw}</b><br>💾 স্থায়ী স্টোরেজ: <b>${per}</b> · ধরন: ${A.DB.isIdb() ? 'IndexedDB' : 'localStorage'}`;
    }
    stat();
    $('#sref', c7).onclick = stat;
    $('#sper', c7).onclick = async () => { try { const ok = navigator.storage && navigator.storage.persist ? await navigator.storage.persist() : false; A.toast(ok ? 'স্থায়ী স্টোরেজ চালু হয়েছে' : 'ব্রাউজার অনুমতি দেয়নি (অ্যাপ ইনস্টল করলে সহজে মেলে)'); } catch (e) { A.toast('সম্ভব হয়নি'); } stat(); };
    $('#sinst', c7).onclick = async () => {
      const ev = A.installEvt;
      if (ev) { ev.prompt(); try { await ev.userChoice; } catch (e) { } A.installEvt = null; }
      else A.dlg({ title: '📲 অ্যাপ হিসাবে ইনস্টল', html: '<p><b>Android Chrome:</b> ডানদিকের উপরের ⋮ মেনু → "Install app" / "হোম স্ক্রিনে যোগ করুন"।</p><p><b>কম্পিউটারে Chrome/Edge:</b> অ্যাড্রেস বারের ডানদিকের ইনস্টল আইকন (⊕) চাপুন।</p><p class="note">ইনস্টল অপশন আসতে হলে সাইটটি HTTPS-এ (GitHub Pages) খুলতে হবে।</p>', w: 440, buttons: [{ t: 'ঠিক আছে', cls: 'pri' }] });
    };

    /* ---------- ৮. JSON ব্যাকআপ ---------- */
    const c8 = card(`<h3>💾 JSON ব্যাকআপ</h3><div class="row"><button class="btn pri" id="bdl">⬇ ব্যাকআপ ডাউনলোড</button><div><label>ব্যাকআপ ফাইল বেছে নিন</label><input type="file" id="brf" accept=".json,application/json"></div><button class="btn" id="brs">⟲ রিস্টোর করুন</button></div>
      <p class="note">ব্যাকআপে এই প্রোফাইলের সব প্রজেক্ট, লোড, নোট ও ছবি থাকে (PIN থাকে না)। রিস্টোর করলে বর্তমান ডাটা ফাইলের ডাটা দিয়ে বদলে যাবে। পুরনো ড্যাশবোর্ডের ব্যাকআপ ফাইলও রিস্টোর করা যায়।</p>`);
    root.appendChild(c8);
    $('#bdl', c8).onclick = () => { const d = SL.clone(A.D()); delete d.profile.ph; delete d.profile.rh; delete d.profile.salt; A.dl(`solar_backup_${d.profile.name.replace(/[^\wঀ-৿-]+/g, '_')}_${SL.ymd()}.json`, new Blob([JSON.stringify(d)], { type: 'application/json' })); };
    $('#brs', c8).onclick = async () => {
      const fl = $('#brf', c8).files[0]; if (!fl) { A.toast('আগে ব্যাকআপ ফাইল বেছে নিন'); return; }
      let o; try { o = JSON.parse(await fl.text()); } catch (e) { A.toast('ফাইলটি সঠিক JSON নয়'); return; }
      let nd; if (SL.isNewFmt(o)) nd = o; else if (SL.isLegacy(o)) nd = SL.fromLegacy(o, A.D().profile); else { A.toast('এটি সোলার ড্যাশবোর্ডের ব্যাকআপ ফাইল নয়'); return; }
      if (!(await A.ask('বর্তমান সব ডাটা ফাইলের ডাটা দিয়ে বদলে যাবে। চালিয়ে যাবেন?', { danger: true, ok: 'রিস্টোর' }))) return;
      if (!nd.profile) nd.profile = A.D().profile;
      A.replaceData(nd); A.toast('রিস্টোর সম্পন্ন');
    };
  });
})();

</script>
<script>window.addEventListener('DOMContentLoaded',function(){App.boot()})</script>
</body>
</html>
